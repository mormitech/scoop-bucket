name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scoop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path 'scoop\shims' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install mctwain from this bucket
        shell: pwsh
        run: scoop install .\bucket\mctwain.json
      - name: It runs, with its tray, and starts at login
        shell: pwsh
        run: |
          Start-Sleep -Seconds 8
          $status = Invoke-RestMethod http://127.0.0.1:7788/status
          if ($status.name -ne 'mctwain') { throw 'helper does not answer on 7788' }
          Write-Host "helper answers: version $($status.version)"
          if (-not (Get-Process mctwain-tray -ErrorAction SilentlyContinue)) { throw 'tray is not running' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').mctwain) { throw 'no startup entry' }
          if (-not (Test-Path "$env:LOCALAPPDATA\mctwain\start.vbs")) { throw 'no start.vbs' }
      - name: Uninstall removes everything
        shell: pwsh
        run: |
          scoop uninstall mctwain
          Start-Sleep -Seconds 3
          if (Get-Process mctwain, mctwain-tray -ErrorAction SilentlyContinue) { throw 'processes still running' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).mctwain) { throw 'startup entry left' }
          if (Test-Path "$env:LOCALAPPDATA\mctwain") { throw 'start.vbs folder left' }
          Write-Host 'install and uninstall both work'
