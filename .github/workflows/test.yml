name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mctwain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path 'scoop\shims' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install mctwain from this bucket
        shell: pwsh
        run: scoop install .\bucket\mctwain.json
      - name: It runs, with its tray, and starts at login
        shell: pwsh
        run: |
          Start-Sleep -Seconds 8
          $status = Invoke-RestMethod http://127.0.0.1:7788/status
          if ($status.name -ne 'mctwain') { throw 'helper does not answer on 7788' }
          Write-Host "helper answers: version $($status.version)"
          if (-not (Get-Process mctwain-tray -ErrorAction SilentlyContinue)) { throw 'tray is not running' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').mctwain) { throw 'no startup entry' }
          if (-not (Test-Path "$env:LOCALAPPDATA\mctwain\start.vbs")) { throw 'no start.vbs' }
      - name: Uninstall removes everything
        shell: pwsh
        run: |
          scoop uninstall mctwain
          Start-Sleep -Seconds 3
          if (Get-Process mctwain, mctwain-tray -ErrorAction SilentlyContinue) { throw 'processes still running' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).mctwain) { throw 'startup entry left' }
          if (Test-Path "$env:LOCALAPPDATA\mctwain") { throw 'start.vbs folder left' }
          Write-Host 'install and uninstall both work'

  mcprint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path 'scoop\shims' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install mcprint from this bucket
        shell: pwsh
        run: scoop install .\bucket\mcprint.json
      - name: It is installed, with a Start menu entry, and it starts
        shell: pwsh
        run: |
          $exe = (Get-Command mcprint).Source
          Write-Host "mcprint command: $exe"
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Scoop Apps\mcPrint.lnk'
          if (-not (Test-Path $lnk)) { throw 'no Start menu shortcut' }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "mcprint exited right after starting (exit code $($app.ExitCode))" }
          Write-Host 'mcprint is running'
          Stop-Process -Id $app.Id -Force
      - name: Uninstall removes everything
        shell: pwsh
        run: |
          scoop uninstall mcprint
          if (Get-Command mcprint -ErrorAction SilentlyContinue) { throw 'command still there' }
          if (Test-Path "$env:USERPROFILE\scoop\apps\mcprint") { throw 'app folder left' }
          Write-Host 'install and uninstall both work'

  mormidiskfree:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path 'scoop\shims' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install mormidiskfree from this bucket
        shell: pwsh
        run: scoop install .\bucket\mormidiskfree.json
      - name: It is installed, with a Start menu entry, and it starts
        shell: pwsh
        run: |
          $exe = (Get-Command mormidiskfree).Source
          Write-Host "mormidiskfree command: $exe"
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Scoop Apps\mormiDiskFree.lnk'
          if (-not (Test-Path $lnk)) { throw 'no Start menu shortcut' }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "mormidiskfree exited right after starting (exit code $($app.ExitCode))" }
          Write-Host 'mormidiskfree is running'
          Stop-Process -Id $app.Id -Force
      - name: Uninstall removes everything
        shell: pwsh
        run: |
          scoop uninstall mormidiskfree
          if (Get-Command mormidiskfree -ErrorAction SilentlyContinue) { throw 'command still there' }
          if (Test-Path "$env:USERPROFILE\scoop\apps\mormidiskfree") { throw 'app folder left' }
          Write-Host 'install and uninstall both work'
